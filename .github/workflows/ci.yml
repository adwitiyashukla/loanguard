name: CI

# Runs on every push/PR to main. Two lightweight jobs that verify the
# project actually works end-to-end - they don't enforce strict style
# rules (that's what pre-commit is for locally).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: End-to-end smoke test (synthetic data)
        run: python scripts/smoke_test.py

      - name: Unit tests (pytest)
        run: pytest -q --maxfail=3 --no-cov
