name: HuggingFace Space Keep-Alive + Health Check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep-alive ping (wakes Space if sleeping, resets sleep timer)
        run: |
          SPACE_URL="https://adwitiyashukla-loanguard.hf.space"
          echo "Pinging $SPACE_URL to keep it warm"

          HTTP_CODE=$(curl -sSL -o /dev/null -w "%{http_code}" \
            --max-time 30 "$SPACE_URL" || echo "000")

          echo "HTTP status from Space URL: $HTTP_CODE"

          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" -ge 500 ]; then
            echo "Space URL unreachable or 5xx - will confirm via API below."
          else
            echo "Space URL responded OK (visit counted, sleep timer reset)."
          fi

      - name: Confirm Space stage via HuggingFace API
        run: |
          API_URL="https://huggingface.co/api/spaces/adwitiyashukla/loanguard"
          STAGE=$(curl -sS "$API_URL" | grep -oE '"stage":"[^"]+"' | head -1)
          echo "Reported stage: $STAGE"

          case "$STAGE" in
            *RUNTIME_ERROR*|*BUILD_ERROR*|*NO_APP_FILE*|*PAUSED*|*DELETING*|*CONFIG_ERROR*)
              echo "Space is in a broken state that needs manual attention."
              echo "Visit: https://huggingface.co/spaces/adwitiyashukla/loanguard"
              exit 1
              ;;
            *RUNNING*|*BUILDING*|*STARTING*|*SLEEPING*|*APP_STARTING*)
              echo "Space stage is acceptable (running or transient)."
              exit 0
              ;;
            *)
              echo "Unknown stage - not failing, but worth checking manually."
              exit 0
              ;;
          esac
